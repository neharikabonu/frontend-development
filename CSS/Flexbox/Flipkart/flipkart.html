<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="flipkart.css">
</head>

<body>
  <div class="container">
    <img src="Flipkart_logo_(2026).svg">
    <p class="para">Get access to Orders, Wishlist <br> and Recommendations</p>
    <p class="para1">Login to your Account</p>

    <div class="form">
      <form>
        <div class="content">
          <label for="email">Email ID / Mobile Number</label><br>
          <input type="text" name="email" id="email">
        </div>

        <div class="content">
          <label for="password">Enter Password</label><br>
          <input type="text" name="password" id="password">
        </div>
        <div class="check">
          <div class="first-part">
            <input type="checkbox" name="signedin" id="signed-in">
            <label for="signed-in">Keep me signed in</label>
          </div>
          <div class="second-part">
            <a href="#">Forgot Password?</a>
          </div>
        </div>

        <div class="buttons">
          <button class="login">Login</button>
          <span>or</span>
          <a href="#" class="otp">Request OTP</a>
        </div>

        <div class="create">
          <p class="para2">Don't have an account?</p>
          <a href="#">Sign Up</a>
        </div>

      </form>
    </div>


  </div>
</body>

</html>
