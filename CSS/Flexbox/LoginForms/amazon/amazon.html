<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="amazon.css">
</head>

<body>
  <div class="container">
    <img class="logo" src="amazon.png" alt="">
    <h3 class="login">Login</h3>

    <div class="labels">
      <label for="email">Email or mobile phone number</label> <br>
      <input type="text" name="email" id="email">
    </div>

    <div class="labels">
      <div class="labels-password">
        <label for="password">Password</label>
        <a href="#" class="forgot-password">Forgot Password</a>
      </div>
      <input type="password" name="password" id="password">
    </div>

    <button class="login-button">Login</button>

    <div class="checks">
      <input type="checkbox" id="check-box">
      <label for="check-box">Keep me signed in. </label>
      <a href="#" class="details">Details</a>
    </div>

    <div class="new-user">
     <span>New to Amazon?</span>
    </div>

    <button class="create-button">Create your Amazon account</button>
  </div>
</body>

</html>
