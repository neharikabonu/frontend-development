<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="facebook.css">
</head>

<body>

  <div class="container">

    <div class="intro">
      <h1 class="logo">facebook</h1>
      <p>Facebook helps you connect and <br>share with the people in your life</p>
    </div>

    <div class="form-body">
      <form class="forms">

      <h2 class="log-in">Log in to Facebook</h2>

        <div class="email-address input-values">
          <label for="email">Enter email address or phone number</label><br>
        <input type="text" name="email" id="email">
        </div>
        
         <div class="password input-values">
          <label for="password">Password</label><br>
        <input type="password" name="email" id="email">
        </div>

        <button class="login-button">Log in</button>

        <div class="login-problems">
            <p class="bottom">Problems loggin in?</p>
          <a href="#" class="bottom">Reset your password</a>
        </div>

          <hr>

          <div class="new-account">
            <p class="bottom">New to Facebook?</p>
          <a href="#" class="bottom">Create an account</a>
          </div>

      </form>

    </div>

    <div class="footer">
      <p><a href="#">Create a Page</a> for a celebrity, brand or businnes.</p>
    </div>

    

  </div>

</body>

</html>
