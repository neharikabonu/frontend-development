<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form action="">
    <h1>Basic HTML Form</h1>
    <fieldset>
      <legend>Name</legend>
      <br>
      <label for="first-name">First Name</label>
      <input type="text" name="fname" id="first-name">
      <br><br>
      <label for="last-name">Last Name</label>
      <input type="text" name="lname" id="last-name">
      <br>
    </fieldset>

    <fieldset>
      <legend>Other Questions</legend>
      <br>
      <label>Choose a drink</label>
      <br>
      <input type="radio" name="drink" id="coffee">
      <label for="coffee">Coffee</label>
      <br>
      <input type="radio" name="drink" id="tea">
      <label for="tea">Tea</label>
      <br>
      <input type="radio" name="drink" id="hot-chocolate">
      <label for="hot-chocolate">Hot chocolate</label>
      <br><br>
      <label for="">What ice-cream do you like?</label>
      <br>
      <input type="checkbox" name="ice-cream" id="chocolate">
      <label for="chocolate">Chocolate</label>
      <br>
      <input type="checkbox" name="ice-cream" id="chocolate-pudding">
      <label for="chocolate-pudding">Chocolate Pudding</label>
      <br>
      <input type="checkbox" name="ice-cream" id="chocolate-butter">
      <label for="chocolate-butter">Chocolate Peanut Butter</label>
      <br>
      <input type="checkbox" name="ice-cream" id="vanilla">
      <label for="vanilla">Vanilla</label>
      <br>
      <input type="checkbox" name="ice-cream" id="strawberry">
      <label for="strawberry">Strawberry</label>
      <br><br>

      <label for="">Please provide comments</label><br>
      <textarea name="feedback" id="feedback"></textarea>
    </fieldset>
    <br>
    <button>Submit</button>
  </form>
</body>
</html>
